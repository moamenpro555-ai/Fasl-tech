<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السلة وإتمام الشراء | FASL TECH</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>
  <div class="page-title"><div class="container"><h1>🛒 السلة وإتمام الشراء</h1></div></div>

  <div class="container cart-layout">
    <div class="panel"><h3>منتجات السلة</h3><div id="cartItems"></div></div>

    <aside class="panel" id="summary">
      <h3>ملخص الطلب</h3>
      <div class="coupon">
        <input type="text" id="couponInput" placeholder="كود الخصم">
        <button class="btn btn-navy btn-sm" id="couponBtn">تطبيق</button>
      </div>
      <div class="sum-row"><span>الإجمالي الفرعي</span><span id="sub">0</span></div>
      <div class="sum-row"><span>الخصم</span><span id="disc">0</span></div>
      <div class="sum-row total"><span>الإجمالي</span><span id="total">0</span></div>

      <div class="form-row" style="margin-top:14px">
        <label>وسيلة الدفع</label>
        <select id="method" style="width:100%"></select>
      </div>
      <button class="btn btn-gold btn-block" id="checkoutBtn">إتمام الطلب</button>
      <p class="note" style="margin-top:12px">نسخة تجريبية: الدفع الفعلي يحتاج ربط بوابة دفع وBackend يتحقق من الدفع قبل إتاحة التحميل.</p>
    </aside>
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
