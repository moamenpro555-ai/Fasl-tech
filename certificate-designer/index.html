<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مصمم الشهادات | FASL TECH</title>
  <meta name="theme-color" content="#0f1c3a">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700;800;900&family=Reem+Kufi:wght@500;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
  <style>
/* ===================== FASL TECH · نظام التصميم المشترك ===================== */
:root{
  --ink:#0f1c3a;--ink-2:#17294f;--ink-3:#26407a;
  --gold:#f5b942;--gold-2:#dd9d22;--gold-soft:#fff3d4;
  --bg:#f1f4fa;--card:#fff;--line:#e2e7f2;--line-2:#cfd7e8;
  --text:#18213b;--muted:#68759a;
  --ok:#14966a;--ok-bg:#dcf5ea;--bad:#d93f35;--bad-bg:#fde4e1;
  --warn:#c98412;--warn-bg:#fff0cf;--info:#2f66dc;--info-bg:#e0eaff;
  --side:#0f1c3a;
  --r:14px;--r-sm:9px;--r-lg:20px;
  --sh:0 1px 2px rgba(15,28,58,.06),0 10px 26px -14px rgba(15,28,58,.22);
  --font:'IBM Plex Sans Arabic','Cairo','Segoe UI',Tahoma,'DejaVu Sans',sans-serif;
}
[data-theme=dark]{
  --bg:#0a1125;--card:#121c38;--line:#24325a;--line-2:#31427a;--text:#e9eefb;--muted:#93a1c7;
  --gold-soft:#3a2f12;--ok-bg:#0f3a2c;--bad-bg:#44201f;--warn-bg:#42310e;--info-bg:#182a55;--side:#070d1d;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;direction:rtl;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:var(--ink)}
.ico{width:1.2em;height:1.2em;flex:none;vertical-align:-.2em}
.hide{display:none!important}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.center{text-align:center}
.nowrap{white-space:nowrap}
.sm{font-size:.86rem}.xs{font-size:.78rem}
.b{font-weight:700}
.mt{margin-top:16px}.mb{margin-bottom:16px}.mt2{margin-top:28px}

/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#c3cdea;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:44px;height:44px;border-radius:13px;background:var(--ink-3);display:grid;place-items:center;color:var(--gold);flex:none;overflow:hidden}
.brand .logo svg{width:26px;height:26px}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;color:#fff;font-size:1.05rem;line-height:1.25}
.brand small{color:var(--gold);font-weight:600;font-size:.74rem}
.nav{padding:12px 0;flex:1}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 14px;margin:2px 10px;border-radius:11px;color:#aebadf;font-weight:600;font-size:.95rem;position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(245,185,66,.15);color:var(--gold)}
.nav a.on::before{content:"";position:absolute;inset-inline-end:-10px;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--gold)}
.nav .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:20px;font-size:.72rem;padding:0 7px;min-width:20px;text-align:center;line-height:20px}
.nav .sep{height:1px;background:rgba(255,255,255,.07);margin:10px 18px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:.78rem;color:#7f8db5}
.side-foot b{color:var(--gold)}
.main{padding:26px clamp(16px,3vw,42px) 70px;min-width:0}
.topbar{display:none}
.view{max-width:1380px;margin-inline:auto}
.scrim{display:none}

@media(max-width:940px){
  .app{display:block}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:290px;max-width:86vw;transform:translateX(105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:35}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--side);color:#fff;position:sticky;top:0;z-index:30}
  .topbar b{font-size:1rem}
  .topbar .icon-btn{color:#fff}
  .main{padding-top:18px}
}

/* ---------- عناوين الصفحات ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:1.65rem;line-height:1.25;font-weight:800;letter-spacing:-.2px}
.ph p{color:var(--muted);margin-top:4px;max-width:62ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.h2{font-size:1.1rem;font-weight:800;margin:0 0 12px}
.h3{font-size:.98rem;font-weight:700;margin-bottom:8px}

/* ---------- أزرار ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:11px;padding:9px 18px;font-weight:700;font-size:.93rem;line-height:1.3;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;background:var(--ink);color:#fff}
.btn:hover{background:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:var(--gold-2)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-2)}.btn.ghost:hover{background:var(--card);border-color:var(--ink-3)}
.btn.soft{background:var(--info-bg);color:var(--info)}.btn.soft:hover{filter:brightness(.96)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad);color:#fff}.btn.danger:hover{filter:brightness(.92)}
.btn.dangerg{background:transparent;color:var(--bad);border-color:var(--bad-bg)}.btn.dangerg:hover{background:var(--bad-bg)}
.btn.wa{background:#1faa59;color:#fff}.btn.wa:hover{background:#188a47}
.btn.sm{padding:5px 12px;font-size:.84rem;border-radius:9px}
.btn.lg{padding:13px 26px;font-size:1.02rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line);color:var(--text)}
.icon-btn.bad:hover{background:var(--bad-bg);color:var(--bad)}

/* ---------- بطاقات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:1rem;font-weight:800}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* مؤشرات */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .k-l{color:var(--muted);font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .k-v{font-size:1.95rem;font-weight:800;line-height:1.2;margin-top:6px;letter-spacing:-.5px}
.kpi .k-s{font-size:.8rem;color:var(--muted);margin-top:2px}
.kpi::after{content:"";position:absolute;inset-inline-end:0;top:0;bottom:0;width:4px;background:var(--kc,var(--gold))}
.kpi.ok{--kc:var(--ok)}.kpi.bad{--kc:var(--bad)}.kpi.info{--kc:var(--info)}.kpi.warn{--kc:var(--warn)}

/* شارات */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 10px;font-size:.78rem;font-weight:700;background:var(--line);color:var(--text);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg);color:var(--info)}
.badge.gold{background:var(--gold-soft);color:var(--gold-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);border-radius:20px;padding:3px 12px;font-size:.85rem;font-weight:600;background:var(--card);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:.9rem;color:#fff;flex:none}
.avatar.lg{width:64px;height:64px;font-size:1.5rem}

/* شريط تقدم */
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;min-width:60px}
.prog>i{display:block;height:100%;border-radius:8px;background:var(--ok)}
.prog.warn>i{background:var(--warn)}.prog.bad>i{background:var(--bad)}.prog.gold>i{background:var(--gold)}

/* ---------- نماذج ---------- */
.fgrid{display:flex;flex-wrap:wrap;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;flex:1 1 100%;min-width:0}
.f.half{flex:1 1 calc(50% - 7px)}.f.third{flex:1 1 calc(33% - 10px)}
.f>span{font-size:.84rem;font-weight:700;color:var(--muted)}
.f>small{color:var(--muted);font-size:.78rem}
.in,input:not([type]),input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=password],input[type=search],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--text);transition:border-color .15s,box-shadow .15s;min-height:42px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(245,185,66,.28)}
input.bad,select.bad,textarea.bad{border-color:var(--bad)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--ink-3)}
input[type=color]{padding:3px;min-height:42px;width:64px}
input[type=range]{accent-color:var(--gold-2);width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow:auto;border:1.5px solid var(--line-2);border-radius:10px;padding:10px}
.checks label{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:3px 10px;font-size:.88rem;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.search{position:relative;min-width:220px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-inline-start:38px}
.seg{display:inline-flex;background:var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 14px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--gold)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}

/* ---------- جداول ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{position:sticky;top:0;background:var(--bg);color:var(--muted);font-size:.8rem;font-weight:800;text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(245,185,66,.07)}
.tbl td.num,.tbl th.num{text-align:center}
.tbl .who{display:flex;align-items:center;gap:10px;font-weight:700}
.tbl input.cell{width:76px;text-align:center;padding:5px 6px;min-height:34px;border-radius:8px}

/* ---------- دفتر المدرس: أختام الحضور ---------- */
.mk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;font-weight:800;font-size:.8rem;border:0;background:var(--line);color:var(--muted)}
.mk.p{background:var(--ok-bg);color:var(--ok)}.mk.a{background:var(--bad-bg);color:var(--bad)}
.mk.l{background:var(--warn-bg);color:var(--warn)}.mk.e{background:var(--info-bg);color:var(--info)}
.mk.sq{border-radius:4px;width:18px;height:18px;font-size:0}
.stamp{display:inline-flex;gap:4px}
.stamp button{border:1.5px solid var(--line-2);background:var(--card);border-radius:10px;padding:5px 11px;font-weight:700;font-size:.84rem;color:var(--muted)}
.stamp button.on.p{background:var(--ok);border-color:var(--ok);color:#fff}
.stamp button.on.a{background:var(--bad);border-color:var(--bad);color:#fff}
.stamp button.on.l{background:var(--warn);border-color:var(--warn);color:#fff}
.stamp button.on.e{background:var(--info);border-color:var(--info);color:#fff}

/* ---------- حالات فارغة ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .e-ic{width:70px;height:70px;border-radius:22px;background:var(--gold-soft);color:var(--gold-2);display:grid;place-items:center;margin:0 auto 14px}
.empty .e-ic svg{width:34px;height:34px}
.empty h3{color:var(--text);font-size:1.12rem;margin-bottom:4px}
.empty p{max-width:46ch;margin:0 auto 16px}

/* ---------- مودال ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(8,14,32,.6);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .18s}
.modal.sm{max-width:420px}.modal.lg{max-width:820px}.modal.xl{max-width:1100px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:1.08rem;font-weight:800}
.m-body{padding:20px;overflow:auto;flex:1}
.m-foot{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 var(--r-lg) var(--r-lg)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;bottom:22px;inset-inline-start:22px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 18px;box-shadow:0 12px 32px rgba(0,0,0,.35);font-weight:600;display:flex;align-items:center;gap:10px;animation:pop .2s;max-width:380px;border-inline-start:5px solid var(--gold)}
.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}

/* ---------- مخططات ---------- */
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.hbar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;margin:7px 0;font-size:.88rem}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .v{text-align:left;font-weight:800;direction:ltr}

/* ---------- تنبيهات ---------- */
.note{border-radius:12px;padding:12px 16px;background:var(--info-bg);color:var(--info);font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.ok{background:var(--ok-bg);color:var(--ok)}.note.bad{background:var(--bad-bg);color:var(--bad)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.divider{height:1px;background:var(--line);margin:18px 0}
kbd{background:var(--line);border-radius:6px;padding:1px 7px;font-size:.8rem;font-family:inherit;border:1px solid var(--line-2)}

/* ---------- طباعة ---------- */
.print-only{display:none}
@media print{
  @page{margin:10mm}
  html,body{background:#fff!important;color:#000!important}
  .side,.topbar,.no-print,.toasts,.modal-wrap,.scrim{display:none!important}
  .app{display:block}.main{padding:0}
  .card,.kpi,.tbl-wrap{box-shadow:none!important}
  .print-only{display:block}
  .pb{page-break-after:always}.pbi{page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.print-doc{background:#fff;color:#111;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- بطاقات المذاكرة ---------- */
.fc-wrap{perspective:1200px;max-width:560px;margin:0 auto}
.fc{position:relative;height:340px;cursor:pointer;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:grid;place-items:center;padding:28px;text-align:center;font-size:1.7rem;font-weight:800;line-height:1.6;box-shadow:var(--sh)}
.fc .ff{background:var(--card);border:2px solid var(--line-2);color:var(--text)}
.fc .fb{background:linear-gradient(135deg,var(--ink),var(--ink-3));color:#fff;transform:rotateY(180deg)}
.fc small{position:absolute;top:14px;inset-inline-start:18px;font-size:.78rem;font-weight:700;opacity:.55}
.boxes{display:flex;gap:6px;justify-content:center}.boxes i{width:34px;height:8px;border-radius:6px;background:var(--line)}.boxes i.on{background:var(--gold)}
@media(prefers-reduced-motion:reduce){.fc{transition:none}}

/* ---------- وضع المسابقة (شاشة العرض) ---------- */
.cmp{position:fixed;inset:0;z-index:150;background:radial-gradient(circle at 80% 0,#26407a 0,#0f1c3a 55%,#070d1d 100%);color:#fff;display:flex;flex-direction:column;padding:22px clamp(16px,3vw,48px);overflow:auto}
.cmp-top{display:flex;align-items:center;gap:16px}.cmp-top h2{font-size:1.2rem;opacity:.85;flex:1}
.cmp-tm{width:84px;height:84px}.cmp-q{flex:1;display:grid;align-content:center;gap:26px;max-width:1200px;width:100%;margin:0 auto;padding:10px 0}
.cmp-q .qt{font-size:clamp(1.6rem,4vw,3.1rem);font-weight:800;line-height:1.5;text-align:center}
.cmp-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-o{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px 20px;font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:700;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.14)}
.cmp-o b{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:none;font-size:1.4rem}

    return { p, l, a, e, total: ms.length, rate: den ? Math.round((p + l) / den * 100) : null };
  };
  S.examPct = (g) => { const e = FT.db.exams.find(x => x.id === g.examId); return e && e.max ? g.score / e.max * 100 : null; };
  S.grades = sid => FT.db.grades.filter(g => g.studentId === sid).map(g => { const e = FT.db.exams.find(x => x.id === g.examId); return e ? { exam: e, score: g.score, pct: e.max ? g.score / e.max * 100 : 0 } : null; }).filter(Boolean).sort((a, b) => a.exam.date.localeCompare(b.exam.date));
  S.avgGrade = sid => { const g = S.grades(sid); return g.length ? FT.round(FT.avg(g.map(x => x.pct)), 1) : null; };
  S.hw = sid => {
    const hs = FT.db.hwStatus.filter(h => h.studentId === sid);
    const done = hs.filter(h => h.s === "done").length, late = hs.filter(h => h.s === "late").length, part = hs.filter(h => h.s === "partial").length, miss = hs.filter(h => h.s === "missing").length;
    const tot = hs.length;
    return { done, late, part, miss, total: tot, rate: tot ? Math.round((done + late * .7 + part * .4) / tot * 100) : null };
  };
  S.fee = sid => { const s = FT.student(sid); if (!s) return 0; if (s.fee !== "" && s.fee != null && !isNaN(s.fee)) return Number(s.fee); const g = FT.group(s.groupId); return g ? Number(g.fee) || 0 : 0; };
  S.paid = (sid, ym) => FT.sum(FT.db.payments.filter(p => p.studentId === sid && (!ym || p.month === ym)).map(p => p.amount));
  S.balance = (sid, ym) => S.fee(sid) - S.paid(sid, ym);
  /* كل الشهور اللي عليها مستحقات للطالب من أول دفعة/انضمام لحد الشهر الحالي */
  S.months = (sid) => {
    const s = FT.student(sid); if (!s) return [];
    const first = D.ym(s.joined || D.today()), cur = D.ym(D.today()); const out = []; let m = first;
    const pm = FT.db.payments.filter(p => p.studentId === sid).map(p => p.month).sort()[0]; if (pm && pm < m) m = pm;
    while (m <= cur && out.length < 36) { out.push(m); m = D.ym(D.addMonths(m + "-01", 1)); }
    return out;
  };
  S.arrears = sid => FT.sum(S.months(sid).map(ym => Math.max(0, S.balance(sid, ym))));
  S.hwOwed = ym => ym;
  S.risk = sid => {
    const a = S.att(sid, D.add(D.today(), -42)), g = S.avgGrade(sid), h = S.hw(sid); let pts = 0; const why = [];
    if (a.rate != null && a.rate < 70) { pts += 2; why.push("حضور ضعيف " + a.rate + "%"); } else if (a.rate != null && a.rate < 82) { pts += 1; why.push("حضور متذبذب"); }
    if (g != null && g < 50) { pts += 2; why.push("متوسط درجات " + g + "%"); } else if (g != null && g < 65) { pts += 1; why.push("درجات تحتاج دعم"); }
    if (h.rate != null && h.rate < 50) { pts += 1; why.push("واجبات ناقصة"); }
    return { level: pts >= 3 ? "high" : pts >= 1 ? "mid" : "low", pts, why };
  };
  S.riskBadge = r => r.level === "high" ? `<span class="badge bad">محتاج متابعة</span>` : r.level === "mid" ? `<span class="badge warn">انتبه</span>` : `<span class="badge ok">ممتاز</span>`;
  S.gradeLabel = p => p == null ? "—" : p >= 90 ? "ممتاز" : p >= 80 ? "جيد جدًا" : p >= 65 ? "جيد" : p >= 50 ? "مقبول" : "ضعيف";
  S.gradeCls = p => p == null ? "" : p >= 80 ? "ok" : p >= 50 ? "warn" : "bad";
  S.groupAtt = (gid, since) => { const ss = FT.groupStudents(gid).map(s => S.att(s.id, since)).filter(x => x.rate != null); return ss.length ? Math.round(FT.avg(ss.map(x => x.rate))) : null; };
  S.rank = (gid, examId) => FT.db.grades.filter(g => g.examId === examId && FT.groupStudents(gid).some(s => s.id === g.studentId)).sort((a, b) => b.score - a.score);
  S.monthRevenue = ym => FT.sum(FT.db.payments.filter(p => p.month === ym || (!p.month && p.date.startsWith(ym))).map(p => p.amount));
  S.cashIn = ym => FT.sum(FT.db.payments.filter(p => p.date.startsWith(ym)).map(p => p.amount));
  S.expenses = ym => FT.sum(FT.db.expenses.filter(e => e.date.startsWith(ym)).map(e => e.amount));
})();

    ["students", "groups", "sessions", "marks", "exams", "grades", "homework", "hwStatus", "payments", "expenses", "lessons", "qbank", "schedule", "decks", "certs", "competitions", "onlineExams", "worksheets"].forEach(k => db[k] = []);
    const G = [
      { id: FT.uid(), name: "تالتة إعدادي — السبت", grade: "الثالث الإعدادي", fee: 250, days: [6, 2], time: "16:00", room: "السنتر", color: "#2f66dc" },
      { id: FT.uid(), name: "تانية ثانوي — الأحد", grade: "الثاني الثانوي", fee: 350, days: [0, 3], time: "18:00", room: "السنتر", color: "#14966a" },
      { id: FT.uid(), name: "أولى ثانوي — الإثنين", grade: "الأول الثانوي", fee: 300, days: [1, 4], time: "14:00", room: "المنزل", color: "#d98b0b" }
    ];
    db.groups = G;
    let ni = 0;
    G.forEach((g, gi) => {
      for (let i = 0; i < 8; i++) {
        const n = NAMES[ni++ % NAMES.length];
        db.students.push({ id: FT.uid(), name: n + " " + pick(["الشريف", "منصور", "فوزي", "عبدالحميد", "الجمل", "سالم"]), groupId: g.id, phone: "01" + pick([0, 1, 2, 5]) + Math.floor(10000000 + rnd() * 89999999), parentName: "والد " + n.split(" ")[0], parentPhone: "01" + pick([0, 1, 2, 5]) + Math.floor(10000000 + rnd() * 89999999), notes: "", joined: D.add(today, -90 - Math.floor(rnd() * 60)), archived: false, skill: .45 + rnd() * .5, attend: .6 + rnd() * .4 });
      }
    });
    /* حصص وحضور آخر 8 أسابيع */
    for (let w = 8; w >= 0; w--) {
      G.forEach(g => {
        g.days.forEach(dw => {
          const base = D.weekStart(D.add(today, -w * 7)); const k = (dw + 1) % 7; const date = D.add(base, k);
          if (date > today) return;
          const s = { id: FT.uid(), groupId: g.id, date, topic: pick(["مراجعة الدرس السابق", "حل تدريبات", "شرح درس جديد", "اختبار قصير", "حل نماذج"]) };
          db.sessions.push(s);
          FT.groupStudents(g.id).forEach(st => { const r = rnd(); db.marks.push({ sessionId: s.id, studentId: st.id, s: r < st.attend ? "p" : r < st.attend + .06 ? "l" : r < st.attend + .09 ? "e" : "a" }); });
        });
      });
    }
    /* امتحانات ودرجات */
    G.forEach(g => {
      [["كويز الأسبوع الأول", 15, 40], ["اختبار شهري", 30, 28], ["كويز الجبر", 20, 14], ["اختبار نصف الترم", 50, 5]].forEach(([t, mx, ago]) => {
        const e = { id: FT.uid(), groupId: g.id, title: t, date: D.add(today, -ago), max: mx, type: mx >= 30 ? "اختبار" : "كويز" };
        db.exams.push(e);
        FT.groupStudents(g.id).forEach(st => { if (rnd() < .07) return; db.grades.push({ examId: e.id, studentId: st.id, score: FT.round(Math.max(0, Math.min(mx, mx * (st.skill + (rnd() - .5) * .3))), 1) }); });
      });
      [["واجب المعادلات", 6], ["واجب الهندسة", 3], ["واجب المراجعة", 1]].forEach(([t, ago]) => {
        const h = { id: FT.uid(), groupId: g.id, title: t, date: D.add(today, -ago - 2), due: D.add(today, -ago), desc: "" }; db.homework.push(h);
        FT.groupStudents(g.id).forEach(st => { const r = rnd(); db.hwStatus.push({ hwId: h.id, studentId: st.id, s: r < st.attend * .8 ? "done" : r < st.attend * .8 + .1 ? "late" : r < .93 ? "partial" : "missing" }); });
      });
    });
    /* مدفوعات: آخر 3 شهور */
    const m0 = D.ym(today);
    for (let k = 2; k >= 0; k--) {
      const ym = D.ym(D.addMonths(today, -k));
      db.students.forEach(st => { const g = FT.group(st.groupId); const r = rnd(); if (k === 0 && r > .55) return; if (r < .78 || k > 0) { const part = rnd() < .12; db.payments.push({ id: FT.uid(), studentId: st.id, month: ym, amount: part ? Math.round(g.fee / 2) : g.fee, date: ym + "-" + D.pad(2 + Math.floor(rnd() * 20)), method: pick(["كاش", "كاش", "فودافون كاش", "إنستاباي"]), note: part ? "دفعة أولى" : "" }); } });
      [["إيجار", 1500], ["طباعة وورق", 320], ["مياه ونور", 240], ["أدوات", 150]].forEach(([c, a]) => db.expenses.push({ id: FT.uid(), date: ym + "-" + D.pad(5 + Math.floor(rnd() * 15)), cat: c, amount: a + Math.round(rnd() * 80), note: "" }));
    }
    /* خطة دروس */
    G.forEach((g, gi) => ["الدرس الأول", "الدرس الثاني", "الدرس الثالث", "مراجعة", "اختبار"].forEach((t, i) => db.lessons.push({ id: FT.uid(), groupId: g.id, title: t + " — " + (gi === 0 ? "الجبر" : gi === 1 ? "التفاضل" : "المعادلات"), date: D.add(today, i * 4 - 8), time: g.time, duration: 90, objectives: "فهم المفهوم الأساسي، حل 5 تمارين تطبيقية", activities: "شرح — أمثلة — حل جماعي", homework: "حل تمارين الكتاب", status: i < 2 ? "done" : "planned", notes: "" })));
    /* بنك أسئلة */
    const Q = [
      ["mcq", "ما قيمة ٢ + ٣ × ٤؟", ["١٤", "٢٠", "١٠", "٢٤"], 0, "الجبر", "سهل"], ["mcq", "حل المعادلة س + ٥ = ١٢", ["٥", "٧", "١٧", "٦"], 1, "الجبر", "سهل"],
      ["mcq", "مجموع زوايا المثلث", ["١٨٠°", "٣٦٠°", "٩٠°", "٢٧٠°"], 0, "الهندسة", "سهل"], ["mcq", "مساحة مستطيل طوله ٨ وعرضه ٥", ["١٣", "٤٠", "٢٦", "٤٥"], 1, "الهندسة", "سهل"],
      ["mcq", "الجذر التربيعي للعدد ٨١", ["٧", "٨", "٩", "١١"], 2, "الجبر", "سهل"], ["mcq", "إذا كان ٣س = ٢١ فإن س =", ["٧", "٦", "٨", "١٨"], 0, "الجبر", "متوسط"],
      ["mcq", "محيط دائرة نصف قطرها ٧ (π = ٢٢/٧)", ["٢٢", "٤٤", "١٥٤", "٤٩"], 1, "الهندسة", "متوسط"], ["mcq", "ناتج (س + ٢)(س − ٢)", ["س² − ٤", "س² + ٤", "س² − ٢", "٢س"], 0, "الجبر", "متوسط"],
      ["tf", "كل عدد أولي فردي", ["صح", "خطأ"], 1, "الجبر", "متوسط"], ["tf", "المثلث المتساوي الأضلاع متساوي الزوايا", ["صح", "خطأ"], 0, "الهندسة", "سهل"],
      ["tf", "الصفر عدد موجب", ["صح", "خطأ"], 1, "الجبر", "سهل"], ["mcq", "ميل المستقيم المار بالنقطتين (٠،٠) و(٢،٦)", ["٢", "٣", "٦", "١/٣"], 1, "الهندسة", "متوسط"],
      ["mcq", "قيمة ٢^٥", ["١٠", "٢٥", "٣٢", "١٦"], 2, "الجبر", "سهل"], ["mcq", "حل المتباينة ٢س > ٨", ["س > ٤", "س < ٤", "س > ١٦", "س > ٢"], 0, "الجبر", "صعب"],
      ["mcq", "مساحة مثلث قاعدته ١٠ وارتفاعه ٦", ["٦٠", "٣٠", "١٦", "٢٠"], 1, "الهندسة", "سهل"], ["mcq", "إذا كانت س² = ٦٤ فإن س =", ["٨ فقط", "±٨", "٣٢", "±٣٢"], 1, "الجبر", "صعب"],
      ["essay", "اشرح خطوات حل معادلة من الدرجة الأولى بمجهول واحد مع مثال.", [], -1, "الجبر", "متوسط"], ["essay", "أثبت أن مجموع زوايا المثلث ١٨٠°.", [], -1, "الهندسة", "صعب"]
    ];
    Q.forEach(([t, q, o, a, ch, df]) => db.qbank.push({ id: FT.uid(), type: t, q, opts: o, ans: a, chapter: ch, diff: df, marks: t === "essay" ? 4 : 1, tags: [], used: 0 }));
    /* جدول */
    G.forEach(g => g.days.forEach(d => db.schedule.push({ id: FT.uid(), day: d, start: g.time, end: D.pad(parseInt(g.time) + 2) + ":" + g.time.split(":")[1], title: g.name, place: g.room, color: g.color, groupId: g.id })));
    /* بطاقات */
    db.decks.push({ id: FT.uid(), title: "قوانين الجبر", cards: [["(أ + ب)²", "أ² + ٢أب + ب²"], ["(أ − ب)²", "أ² − ٢أب + ب²"], ["أ² − ب²", "(أ − ب)(أ + ب)"], ["مميز المعادلة التربيعية", "ب² − ٤أج"], ["قانون الجذور", "(−ب ± √المميز) ÷ ٢أ"]].map(([f, b]) => ({ id: FT.uid(), f, b, box: 1, due: today })), created: today });
    FT.resetStates(); FT.save(true);
  };
})();

</script>
  <script>
/* ===================== الهيكل والتوجيه والإعدادات ===================== */
(function () {
  const FT = window.FT, E = FT.esc, I = FT.icon;

  /* وحدة الإعدادات (موجودة في كل منتج) */
  FT.register({
    id: "settings", title: "الإعدادات", icon: "settings", order: 999,
    render(root) {
      const m = FT.db.meta;
      root.innerHTML = FT.pageHead("الإعدادات", "بياناتك على جهازك بس. خد نسخة احتياطية بشكل دوري.") + `
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>بيانات المدرس</h3></div>
          <div class="fgrid">
            <div class="f half"><span>الاسم</span><input id="sTeacher" value="${E(m.teacher)}"></div>
            <div class="f half"><span>المادة</span><input id="sSubject" value="${E(m.subject)}"></div>
            <div class="f half"><span>رقم الواتساب</span><input id="sPhone" type="tel" value="${E(m.phone)}" placeholder="01xxxxxxxxx"></div>
            <div class="f half"><span>المدرسة / السنتر</span><input id="sSchool" value="${E(m.school)}"></div>
            <div class="f half"><span>العملة</span><input id="sCur" value="${E(m.currency)}"></div>
            <div class="f half"><span>الشعار</span><input id="sLogo" type="file" accept="image/*"></div>
          </div>
          <div class="row mt"><button class="btn gold" id="sSave">${I("check")} حفظ</button>
          <button class="btn ghost" id="sTheme">${I(m.theme === "dark" ? "sun" : "moon")} ${m.theme === "dark" ? "الوضع الفاتح" : "الوضع الداكن"}</button></div>
        </div>
        <div class="card"><div class="card-h"><h3>النسخ الاحتياطي</h3></div>
          <p class="muted sm mb">كل بياناتك محفوظة في المتصفح. لو مسحت بيانات المتصفح أو غيّرت الجهاز هتحتاج النسخة دي.</p>
          <div class="row"><button class="btn" id="sBack">${I("download")} تحميل نسخة احتياطية</button>
          <label class="btn ghost">${I("upload")} استرجاع نسخة<input type="file" id="sRest" accept=".json" hidden></label></div>
          <div class="divider"></div>
          ${FT.cfg.sharing ? `<div class="f"><span>رابط صفحات المشاركة (الامتحانات / أولياء الأمور / المذاكرة)</span><input id="sRunner" class="ltr" style="width:100%" value="${E(m.runnerBase || FT.cfg.runnerBase)}" placeholder="https://..."><small>بيتحط تلقائيًا في المنتج اللي اشتريته. غيّره بس لو نقلت الصفحات لموقع تاني.</small></div><div class="divider"></div>` : ""}
          <div class="row"><button class="btn dangerg" id="sReset">${I("trash")} مسح كل البيانات</button></div>
        </div>
      </div>
      <p class="muted xs center mt2">${E(FT.cfg.name)} · إصدار ${E(FT.cfg.version || "1.0")} · من FASL TECH</p>`;
      const $ = s => FT.$(s, root);
      $("#sSave").onclick = () => { m.teacher = $("#sTeacher").value.trim(); m.subject = $("#sSubject").value.trim(); m.phone = $("#sPhone").value.trim(); m.school = $("#sSchool").value.trim(); m.currency = $("#sCur").value.trim() || "ج.م"; const r = $("#sRunner"); if (r) m.runnerBase = r.value.trim(); FT.save(true); FT.toast("تم الحفظ", "ok"); FT.shell(); };
      $("#sTheme").onclick = () => { m.theme = m.theme === "dark" ? "light" : "dark"; FT.save(true); FT.applyTheme(); FT.refresh(); };
      $("#sLogo").onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"), s = 160, k = Math.min(1, s / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); m.logo = c.toDataURL("image/png"); FT.save(true); FT.shell(); FT.toast("تم تغيير الشعار", "ok"); }; img.src = rd.result; }; rd.readAsDataURL(f); };
      $("#sBack").onclick = () => FT.backup();
      $("#sRest").onchange = async e => { if (!e.target.files[0]) return; if (!await FT.confirm("الاسترجاع هيستبدل كل البيانات الحالية. متأكد؟", "استرجع")) return; try { await FT.restore(e.target.files[0]); FT.toast("تم الاسترجاع", "ok"); FT.shell(); } catch (er) { FT.toast(er.message, "bad"); } };
      $("#sReset").onclick = async () => { if (await FT.confirm("هيتمسح كل حاجة نهائيًا. خد نسخة احتياطية الأول. متأكد؟", "امسح كل حاجة")) { FT.db = FT.blank(); FT.resetStates(); FT.save(true); FT.toast("تم المسح"); FT.shell(); } };
    }
  });

  /* ---------- الهيكل ---------- */
  FT.shell = function () {
    const ids = FT.cfg.modules.concat(["settings"]);
    FT.active = ids.map(id => FT.modules.find(m => m.id === id)).filter(Boolean);
    const m = FT.db.meta;
    document.title = FT.cfg.name + " | FASL TECH";
    const logo = m.logo ? `<img src="${m.logo}" alt="">` : FT.logoSvg;
    const nav = FT.active.map((x, i) => {
      const b = x.badge ? x.badge() : 0;
      return `${x.sepBefore ? '<div class="sep"></div>' : ""}${x.id === "settings" ? '<div class="sep"></div>' : ""}<a href="#/${x.id}" data-id="${x.id}">${I(x.icon)}<span>${E(x.title)}</span>${b ? `<span class="cnt">${b}</span>` : ""}</a>`;
    }).join("");
    document.body.innerHTML = `
    <div class="topbar no-print"><button class="icon-btn" id="burger" aria-label="القائمة">${I("menu")}</button><b>${E(FT.cfg.name)}</b></div>
    <div class="scrim" id="scrim"></div>
    <div class="app">
      <aside class="side no-print" id="side">
        <div class="brand"><div class="logo">${logo}</div><div><b>${E(m.teacher || FT.cfg.name)}</b><small>${E(m.teacher ? FT.cfg.name : "FASL TECH")}</small></div></div>
        <nav class="nav" aria-label="التنقل">${nav}</nav>
        <div class="side-foot">بياناتك محفوظة على جهازك<br><b>FASL TECH</b></div>
      </aside>
      <main class="main"><div class="view" id="view"></div></main>
    </div>`;
    const side = FT.$("#side"), scrim = FT.$("#scrim");
    const tog = o => { side.classList.toggle("open", o); scrim.classList.toggle("open", o); };
    FT.$("#burger").onclick = () => tog(true); scrim.onclick = () => tog(false);
    FT.$$(".nav a").forEach(a => a.onclick = () => tog(false));
    FT.route();
  };
  FT.route = function () {
    const id = (location.hash.replace(/^#\//, "").split("?")[0]) || FT.active[0].id;
    const mod = FT.active.find(x => x.id === id) || FT.active[0];
    FT.$$(".nav a").forEach(a => a.classList.toggle("on", a.dataset.id === mod.id));
    let view = FT.$("#view"); if (!view) return;
    const fresh = view.cloneNode(false); view.replaceWith(fresh); view = fresh; // عنصر جديد في كل رسم علشان مستمعات الأحداث القديمة متتراكمش
    try { mod.render(view, { go: FT.go, refresh: FT.refresh }); }
    catch (e) { console.error(e); view.innerHTML = `<div class="note bad">${I("alert")}<div>حصل خطأ في عرض الصفحة: ${E(e.message)}. جرّب تحميل نسخة احتياطية وإعادة فتح الصفحة.</div></div>`; }
    window.scrollTo(0, 0);
  };

  /* ---------- الترحيب ---------- */
  function welcome() {
    const m = FT.db.meta;
    const w = FT.modal("أهلًا بيك في " + FT.cfg.name, `
      <p class="muted mb">${E(FT.cfg.tagline || "")}</p>
      <div class="fgrid">
        <div class="f half"><span>اسمك</span><input id="wName" placeholder="مثلًا: أ/ أحمد محمود"></div>
        <div class="f half"><span>المادة</span><input id="wSub" placeholder="مثلًا: رياضيات"></div>
      </div>
      <div class="note mt">${I("shield")}<div>كل بياناتك بتتحفظ على جهازك أنت بس، ومحدش غيرك يقدر يشوفها.</div></div>`, { sticky: true, noFocus: false, buttons: [
      { label: "ابدأ", cls: "gold", onClick: () => { m.teacher = FT.$("#wName").value.trim() || "مدرس"; m.subject = FT.$("#wSub").value.trim(); FT.save(true); FT.shell(); } },
      { label: "جرّب ببيانات تجريبية", cls: "ghost", onClick: () => { m.teacher = FT.$("#wName").value.trim() || "أ/ أحمد محمود"; m.subject = FT.$("#wSub").value.trim() || "رياضيات"; FT.demo(); FT.save(true); FT.shell(); } }] });
    FT.$(".m-head [data-close]", w.el).style.display = "none";
  }
  window.addEventListener("hashchange", () => FT.active && FT.route());
  document.addEventListener("DOMContentLoaded", () => {
    FT.load();
    FT.shell();
    if (!FT.db.meta.teacher) welcome();
  });
})();

</script>
