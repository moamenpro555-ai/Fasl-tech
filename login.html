<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | FASL TECH</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <div class="container">
    <div class="auth-box">
      <div class="auth-tabs">
        <button class="active" id="tabLogin">تسجيل الدخول</button>
        <button id="tabRegister">إنشاء حساب</button>
      </div>

      <form id="loginForm">
        <div class="form-row"><label>البريد الإلكتروني</label><input type="email" id="lEmail" required></div>
        <div class="form-row"><label>كلمة المرور</label><input type="password" id="lPass" required></div>
        <button class="btn btn-gold btn-block" type="submit">دخول</button>
      </form>

      <form id="registerForm" style="display:none">
        <div class="form-row"><label>الاسم</label><input type="text" id="rName" required></div>
        <div class="form-row"><label>البريد الإلكتروني</label><input type="email" id="rEmail" required></div>
        <div class="form-row"><label>كلمة المرور (6 أحرف على الأقل)</label><input type="password" id="rPass" minlength="6" required></div>
        <button class="btn btn-gold btn-block" type="submit">إنشاء الحساب</button>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
