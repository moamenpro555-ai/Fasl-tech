<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات | FASL TECH</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media.css">
</head>
<body data-page="products">
  <div id="site-header"></div>

  <div class="page-title"><div class="container"><h1>تصفح المنتجات</h1></div></div>

  <div class="container layout">
    <aside class="filters" id="cats">
      <h4>التصنيف</h4>
      <label><input type="radio" name="cat" value="" checked> الكل</label>
      <div id="catFilters"></div>
      <h4>السعر</h4>
      <label><input type="radio" name="type" value="" checked> الكل</label>
      <label><input type="radio" name="type" value="free"> مجاني</label>
      <label><input type="radio" name="type" value="paid"> مدفوع</label>
      <button class="btn btn-outline btn-sm" id="resetBtn" style="margin-top:14px">إعادة ضبط</button>
    </aside>

    <main>
      <div class="toolbar">
        <input type="text" id="q" placeholder="ابحث بالاسم أو بالكلمات المفتاحية..." style="max-width:320px">
        <div>
          <label>ترتيب: </label>
          <select id="sort">
            <option value="best">الأكثر مبيعًا</option>
            <option value="new">الأحدث</option>
            <option value="low">السعر: الأقل</option>
            <option value="high">السعر: الأعلى</option>
          </select>
        </div>
      </div>
      <div class="products-grid three" id="list"></div>
    </main>
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
